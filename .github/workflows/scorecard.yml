# OpenSSF Scorecard supply-chain security scan.
# Publishes SARIF to the Security tab and feeds the README badge at
# https://api.securityscorecards.dev/projects/github.com/JoshuaMart/websec0/badge.
name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    # Weekly run keeps the badge current independently of pushes.
    - cron: '34 3 * * 1'

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF results to GitHub code-scanning.
      security-events: write
      # Required for OIDC publication to the Scorecard API.
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact (raw SARIF)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          sarif_file: results.sarif
