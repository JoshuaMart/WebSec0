# OpenSSF Scorecard supply-chain security scan.
# Publishes SARIF to the Security tab and feeds the README badge at
# https://api.securityscorecards.dev/projects/github.com/JoshuaMart/websec0/badge.
name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    # Weekly run keeps the badge current independently of pushes.
    - cron: '34 3 * * 1'

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF results to GitHub code-scanning.
      security-events: write
      # Required for OIDC publication to the Scorecard API.
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact (raw SARIF)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          sarif_file: results.sarif
