    <text x="60" y="291" font-size="68" font-weight="700" letter-spacing="-3" fill="#1c2921">security, <tspan fill="#367047">in focus.</tspan></text>
    <text x="64" y="357" font-size="24" fill="#626d62">Understand your configuration.</text>
    <text x="64" y="394" font-size="24" fill="#626d62">Know what needs attention.</text>
