      <rect x="244" width="145" height="36" rx="6" fill="#eaf0e3"/>
      <text x="258" y="24">HTTP headers</text>
    </g>
    <path d="M60 538H1140" stroke="#d8ded2"/>
    <text x="60" y="582" font-size="19" fill="#1c2921">websec0.com</text>
    <text x="1140" y="582" text-anchor="end" font-size="18" fill="#626d62">Free to use. No account needed.</text>
  </g>
